<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#202a31"><meta name="description" content="Máy tính khoa học web, hoạt động ngoại tuyến."><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles/base.css"><link rel="stylesheet" href="styles/calculator.css"><title>ClassWiz 580 · Máy tính khoa học</title></head>
<body><main class="device"><header class="brand"><div><strong>CLASSWIZ</strong><small>SCIENTIFIC CALCULATOR</small></div><span>fx-580VN X · WEB</span></header>
<section class="lcd"><div class="indicators"><span id="angle">DEG</span><span id="mode-indicator">Calculate</span><span id="shift-indicator"></span><span id="memory-indicator"></span></div><div id="expression" class="expression" aria-live="polite">0</div><div id="result" class="result" aria-live="polite"></div><div id="message" class="message" role="status"></div></section>
<nav class="utility"><button data-action="menu">MENU</button><button data-action="angle">DEG/RAD</button><button data-action="history">LỊCH SỬ</button><button data-action="reset">RESET</button></nav>
<section id="mode-workspace" class="workspace" hidden></section>
<section id="keypad" class="keypad" aria-label="Bàn phím"><button class="key function" data-insert="sin(" data-shift="asin(">sin</button><button class="key function" data-insert="cos(" data-shift="acos(">cos</button><button class="key function" data-insert="tan(" data-shift="atan(">tan</button><button class="key function" data-insert="log(">log</button><button class="key function" data-insert="ln(">ln</button><button class="key function" data-insert="sqrt(">√</button><button class="key function" data-insert="^2">x²</button><button class="key function" data-insert="^">xʸ</button><button class="key function" data-insert="(">(</button><button class="key function" data-insert=")">)</button><button class="key" data-insert="7">7</button><button class="key" data-insert="8">8</button><button class="key" data-insert="9">9</button><button class="key operator" data-insert="÷">÷</button><button class="key function" data-action="delete">DEL</button><button class="key" data-insert="4">4</button><button class="key" data-insert="5">5</button><button class="key" data-insert="6">6</button><button class="key operator" data-insert="×">×</button><button class="key function" data-action="clear">AC</button><button class="key" data-insert="1">1</button><button class="key" data-insert="2">2</button><button class="key" data-insert="3">3</button><button class="key operator" data-insert="−">−</button><button class="key function" data-insert="Ans">Ans</button><button class="key" data-insert="0">0</button><button class="key" data-insert=".">.</button><button class="key" data-insert="π">π</button><button class="key operator" data-insert="+">+</button><button class="key exe" data-action="execute">EXE</button></section>
<footer>Chạy cục bộ · Không gửi dữ liệu ra ngoài · Bản phát triển độc lập</footer></main>
<dialog id="menu-dialog"><form method="dialog"><h2>Chọn chế độ</h2><p class="note">12 chế độ theo danh mục fx-580VN X. Một số chế độ là công cụ tính toán thực dụng, chưa tái tạo toàn bộ firmware.</p><div id="mode-list" class="mode-list"></div><button class="close">Đóng</button></form></dialog>
<dialog id="history-dialog"><form method="dialog"><h2>Lịch sử phép tính</h2><div id="history-list"></div><button class="close">Đóng</button><button type="button" id="clear-history">Xóa lịch sử</button></form></dialog>
<script src="src/core/parser.js"></script><script src="src/state/state.js"></script><script src="src/app.js"></script></body></html>
