<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiểm thử lõi</title><style>body{font:16px system-ui;max-width:850px;margin:24px auto;padding:0 12px;background:#172127;color:#eee}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #59666d;text-align:left}.pass{color:#7be0a5}.fail{color:#ff9e9e}</style><h1>Kiểm thử bộ tính toán lõi</h1><p id="summary">Đang chạy…</p><table><thead><tr><th>Mã</th><th>Biểu thức</th><th>Mong đợi</th><th>Thực tế</th><th>Kết quả</th></tr></thead><tbody id="rows"></tbody></table><script src="../src/core/parser.js"></script><script>
const tests=[['CAL-001','2+3*4',14],['CAL-002','(2+3)*4',20],['CAL-003','-2^2',-4],['CAL-004','2^3^2',512],['CAL-005','sqrt(81)',9],['CAL-006','sin(30)',0.5,{angle:'DEG'}],['CAL-007','log(1000)',3],['CAL-008','5!',120],['CAL-009','2π',2*Math.PI],['CAL-010','2(3+4)',14],['CAL-011','1/0',null]];let pass=0;const body=document.getElementById('rows');for(const [id,expr,expected,ctx={}] of tests){let actual='',ok=false;try{actual=CalculatorCore.calculate(expr,ctx).value;ok=expected===null?false:Math.abs(actual-expected)<1e-9;}catch(e){actual='Lỗi: '+e.message;ok=expected===null&&/chia cho 0/i.test(e.message);}const tr=document.createElement('tr');for(const v of [id,expr,expected===null?'Báo lỗi chia 0':expected,actual,ok?'PASS':'FAIL']){const td=document.createElement('td');td.textContent=v;tr.appendChild(td);}tr.lastChild.className=ok?'pass':'fail';body.appendChild(tr);if(ok)pass++;}document.getElementById('summary').textContent=`Tổng ${tests.length} · PASS ${pass} · FAIL ${tests.length-pass}`;
</script></html>
